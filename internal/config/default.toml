# Claude Desktop Gateway — default config (no secrets).
#
# Shipped in the repo root and embedded in the binary. On first run the CLI
# copies this to ~/.config/claude-gateway/config.toml (existing files are kept).
#
# Quick start:
#   export OPENROUTER_API_KEY=sk-or-...
#   ./claude-gateway
#
# Layout: core settings first, models last (easier to edit).
# Live prices:  ./claude-gateway models status
# Model list:   ./claude-gateway models list
#
# [proxy] mode = "local"  → Desktop → local proxy → OpenRouter (default)
# [proxy] mode = "direct" → Desktop → OpenRouter Anthropic API (no local proxy)
# Desktop 3P vs consumer is chosen interactively when the CLI starts.
#
# Add a model at the bottom: desktop_id must look like claude-* or anthropic/claude-*.

version = 1
active_profile = "cheap"         # which [profiles.*] to use (cheap = cost defaults)

# ── Proxy ──────────────────────────────────────────────────────────
[proxy]
mode = "local"                   # local = Desktop → this process → OpenRouter; direct = skip local proxy
listen = "127.0.0.1:8080"
apply_desktop = true             # rewrite Claude Desktop 3P gateway URL on start
# open_guide = true          # open bilingual guide in browser on start
# inspect_prompts = false    # opt-in: capture Desktop system/tools for /debug/harness
# direct_base_url = "https://openrouter.ai/api"  # mode=direct Anthropic base (no /v1)
# spend_alert_usd = 0          # 0 = off; one-shot webhook when this-process est. spend crosses N
# spend_alert_url = ""         # ntfy/webhook URL; never waits on chat; no secrets in the body

# ── Client (optional; interactive prompt usually decides) ──────────
# [client]
# desktop = "3p"                 # or "consumer"
# allow_experimental = false

# ── Providers ──────────────────────────────────────────────────────
[providers.openrouter]
# Official: https://openrouter.ai/api/v1
# Mirror:   https://your-mirror.example.com/api/v1
# Or: export OPENROUTER_BASE_URL=...
base_url = "https://openrouter.ai/api/v1"
# base_url = "http://54.153.43.54:8080/providers/openrouter/api/v1"  # regional mirror
protocol = "openai-compatible"
api_key_env = "OPENROUTER_API_KEY"
auth_scheme = "bearer"
timeout_seconds = 90
tls_verify = true
# Cost controls (OpenRouter provider routing) — see docs/COST.md
sort = "price"                   # price | throughput | latency — cheapest backend for the same model ID
require_parameters = true        # skip backends that drop tools / prompt-cache params
sticky = true                    # pin last successful backend so prompt cache can hit
# allow_private_network = true  # private LAN mirrors only
# ignore_providers = ["DeepInfra"]
# provider_order = ["Anthropic", "Google"]

[providers.nine_router]
base_url = "http://127.0.0.1:20128/v1"  # local 9router; unused unless you switch the profile provider
protocol = "openai-compatible"
api_key_env = "NINEROUTER_API_KEY"
auth_scheme = "bearer"

# ── Profile + routing ──────────────────────────────────────────────
[profiles.cheap]
provider = "openrouter"
proxy_mode = "local"
history_mode = "local"

[profiles.cheap.routing]
default_tier = "fast"            # used when a Desktop ID has no matching rule
fallback_tiers = ["fast", "glm", "kimi"]
prefer_cheapest = true           # among capable candidates, pick lowest list price
ensure_prompt_cache = true       # inject cache_control on system + tools + last stable history block
max_tokens_cap = 32768           # clamp Desktop max_tokens (runaway completions); 0 = unlimited
# circuit_failures = 0         # 0 = off; skip a model after N transient errors when a fallback exists
# circuit_cooldown_seconds = 30

# Desktop picker ID → [models.*] key (what actually runs on OpenRouter)
[[profiles.cheap.routing.rules]]
source = "claude-haiku-4"
target_model = "deepseek_flash"

[[profiles.cheap.routing.rules]]
