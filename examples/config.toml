# Claude Desktop Gateway — example config (no secrets).
#
# Quick start:
#   export OPENROUTER_API_KEY=sk-or-...
#   ./dist/claude-gateway
#
# Layout: core settings first, models last (easier to edit).
# Live prices:  ./dist/claude-gateway models status
# Model list:   ./dist/claude-gateway models list
#
# [proxy] mode = "local"  → Desktop → local proxy → OpenRouter (default)
# [proxy] mode = "direct" → Desktop → OpenRouter Anthropic API (no local proxy)
# Desktop 3P vs consumer is chosen interactively when the CLI starts.
#
# Add a model at the bottom: desktop_id must look like claude-* or anthropic/claude-*.

version = 1
active_profile = "cheap"

# ── Proxy ──────────────────────────────────────────────────────────
[proxy]
mode = "local"
listen = "127.0.0.1:8080"
apply_desktop = true
# direct_base_url = "https://openrouter.ai/api"  # mode=direct Anthropic base (no /v1)

# ── Client (optional; interactive prompt usually decides) ──────────
# [client]
# desktop = "3p"                 # or "consumer"
# allow_experimental = false

# ── Providers ──────────────────────────────────────────────────────
[providers.openrouter]
# Official: https://openrouter.ai/api/v1
# Mirror:   https://your-mirror.example.com/api/v1
# Or: export OPENROUTER_BASE_URL=...
base_url = "https://openrouter.ai/api/v1"
# base_url = "http://54.153.43.54:8080/providers/openrouter/api/v1"  # regional mirror
protocol = "openai-compatible"
api_key_env = "OPENROUTER_API_KEY"
auth_scheme = "bearer"
timeout_seconds = 90
tls_verify = true
# allow_private_network = true  # private LAN mirrors only

[providers.nine_router]
base_url = "http://127.0.0.1:20128/v1"
protocol = "openai-compatible"
api_key_env = "NINEROUTER_API_KEY"
auth_scheme = "bearer"

# ── Profile + routing ──────────────────────────────────────────────
[profiles.cheap]
provider = "openrouter"
proxy_mode = "local"
history_mode = "local"

[profiles.cheap.routing]
default_tier = "fast"
fallback_tiers = ["fast", "glm", "kimi"]

[[profiles.cheap.routing.rules]]
source = "claude-haiku-4"
target_model = "deepseek_flash"

[[profiles.cheap.routing.rules]]
source = "claude-haiku-4-1"
target_model = "glm_flash"

[[profiles.cheap.routing.rules]]
source = "claude-haiku-4-2"
target_model = "mercury_25"

[[profiles.cheap.routing.rules]]
source = "claude-sonnet-4"
target_model = "kimi_k25"

[[profiles.cheap.routing.rules]]
source = "claude-sonnet-4-1"
target_model = "kimi_k26"

[[profiles.cheap.routing.rules]]
source = "claude-sonnet-4-2"
target_model = "kimi_k27"

[[profiles.cheap.routing.rules]]
source = "anthropic/claude-haiku-4.5"
target_model = "claude_haiku_45"

[[profiles.cheap.routing.rules]]
source = "anthropic/claude-3-haiku"
target_model = "claude_haiku_3"

[[profiles.cheap.routing.rules]]
source = "anthropic/claude-sonnet-4.5"
target_model = "claude_sonnet_45"

[[profiles.cheap.routing.rules]]
source = "anthropic/claude-sonnet-4.6"
target_model = "claude_sonnet_46"

[[profiles.cheap.routing.rules]]
source = "anthropic/claude-sonnet-5"
target_model = "claude_sonnet_5"

[[profiles.cheap.routing.rules]]
source = "anthropic/claude-opus-4.6"
target_model = "claude_opus_46"

# Common Desktop aliases → budget defaults
[[profiles.cheap.routing.rules]]
source = "claude-haiku-4-5"
target_model = "claude_haiku_45"

[[profiles.cheap.routing.rules]]
source = "claude-sonnet-4-5"
target_model = "claude_sonnet_45"

[[profiles.cheap.routing.rules]]
source = "sonnet"
target_model = "kimi_k25"

[[profiles.cheap.routing.rules]]
source = "premium"
target_model = "claude_sonnet_45"

[history]
redact_secrets = true
retention_days = 90

[sync]
enabled = false

